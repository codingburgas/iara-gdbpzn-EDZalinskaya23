<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>ГДПБЗН Portal</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    /* ---- Basic reset & page setup ---- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #1a1a1a;
      color: #f0ebe3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---- The card in the middle of the page ---- */
    .card {
      background-color: #2c2c2c;
      border: 1px solid #3d3d3d;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }

    /* ---- Logo at the top ---- */
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
    }

    .logo-icon {
      font-size: 2rem;
    }

    .logo-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #f4821f;
    }

    .logo-subtitle {
      font-size: 11px;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ---- Tabs (Sign In / Register) ---- */
    .tabs {
      display: flex;
      border-bottom: 1px solid #3d3d3d;
      margin-bottom: 1.5rem;
    }

    .tab {
      flex: 1;
      padding: 10px 0;
      background: none;
      border: none;
      color: #888;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      cursor: pointer;
    }

    /* Active tab looks highlighted */
    .tab.active {
      color: #f4821f;
      border-bottom: 2px solid #f4821f;
    }

    /* ---- Form fields ---- */
    label {
      display: block;
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      background-color: #1a1a1a;
      border: 1px solid #3d3d3d;
      border-radius: 6px;
      color: #f0ebe3;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 10px 12px;
      margin-bottom: 1rem;
      outline: none;
    }

    /* Highlight the field when clicked */
    input:focus, select:focus {
      border-color: #f4821f;
    }

    input::placeholder {
      color: #555;
    }

    select option {
      background: #1a1a1a;
    }

    /* ---- Main button ---- */
    .btn-main {
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, #e63b2e, #f4821f);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .btn-main:hover {
      opacity: 0.9;
    }

    /* ---- Secondary guest button ---- */
    .btn-ghost {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid #555;
      border-radius: 6px;
      color: #f0ebe3;
      font-size: 14px;
      cursor: pointer;
      margin-top: 0.6rem;
    }

    .btn-ghost:hover {
      border-color: #f4821f;
      color: #f4821f;
    }

    /* ---- Alert messages ---- */
    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 1rem;
    }

    .alert.success {
      background: rgba(76, 175, 80, 0.15);
      border: 1px solid #4caf50;
      color: #81c784;
    }

    .alert.error {
      background: rgba(230, 59, 46, 0.15);
      border: 1px solid #e63b2e;
      color: #ef9a9a;
    }

    /* ---- Hidden class (used by JavaScript) ---- */
    .hidden {
      display: none;
    }

    /* ---- Small footer note ---- */
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #555;
      margin-top: 1.5rem;
      line-height: 1.6;
    }

    /* small helper text for guest */
    .guest-note {
      font-size: 12px;
      color: #aaa;
      text-align: center;
      margin-top: 0.6rem;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- Logo -->
    <div class="logo">
      <span class="logo-icon" aria-hidden="true">🔥</span>
      <div>
        <div class="logo-title">ГДПБЗН Portal</div>
        <div class="logo-subtitle">Fire Safety Operations</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs" role="tablist" aria-label="Authentication tabs">
      <button class="tab active" onclick="showTab('login')" role="tab" aria-selected="true">Sign In</button>
      <button class="tab"        onclick="showTab('signup')" role="tab" aria-selected="false">Register</button>
    </div>

    <!-- Alert box (hidden by default) -->
    <div id="alert-box" class="alert hidden" role="status" aria-live="polite"></div>

    <!-- ===== LOGIN FORM ===== -->
    <div id="login-form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="officer@gdpbzn.bg" />

      <label for="login-password">Password</label>
      <input type="password" id="login-password" placeholder="••••••••" />

      <button class="btn-main" onclick="handleLogin()">Sign In</button>

      <!-- Guest option for normal users -->
      <button class="btn-ghost" onclick="handleGuest()" aria-label="Continue as guest">Continue as Guest</button>
      <div class="guest-note">Enter as a guest to view public information only</div>
    </div>

    <!-- ===== SIGNUP FORM (hidden by default) ===== -->
    <div id="signup-form" class="hidden">
      <label for="signup-name">Full Name</label>
      <input type="text" id="signup-name" placeholder="Иван Петров" />

      <label for="signup-email">Email</label>
      <input type="email" id="signup-email" placeholder="i.petrov@gdpbzn.bg" />

      <label for="signup-station">Station</label>
      <select id="signup-station">
        <option value="">— Select your station —</option>
        <option>РДПБЗН — Sofia</option>
        <option>РДПБЗН — Plovdiv</option>
        <option>РДПБЗН — Varna</option>
        <option>РДПБЗН — Burgas</option>
        <option>РДПБЗН — Stara Zagora</option>
        <option>Other</option>
      </select>

      <label for="signup-password">Password</label>
      <input type="password" id="signup-password" placeholder="Min 8 characters" />

      <label for="signup-confirm">Confirm Password</label>
      <input type="password" id="signup-confirm" placeholder="Repeat password" />

      <button class="btn-main" onclick="handleSignup()">Create Account</button>
    </div>

    <p class="footer-note">
      For authorized ГДПБЗН personnel only.<br />
      Unauthorized access is prohibited.
    </p>

  </div>

  <script>
    // ---- Helper (shorter way to get elements) ----
const $ = (id) => document.getElementById(id);

// ---- Switch between tabs ----
function showTab(tabName) {
  const isLogin = tabName === 'login';

  $('login-form').classList.toggle('hidden', !isLogin);
  $('signup-form').classList.toggle('hidden', isLogin);

  const tabs = document.querySelectorAll('.tab');

  tabs[0].classList.toggle('active', isLogin);
  tabs[1].classList.toggle('active', !isLogin);

  tabs[0].setAttribute('aria-selected', isLogin);
  tabs[1].setAttribute('aria-selected', !isLogin);

  hideAlert();
}

// ---- Alert system ----
function showAlert(message, type) {
  const box = $('alert-box');
  box.textContent = message;
  box.className = `alert ${type}`;
}

function hideAlert() {
  $('alert-box').className = 'alert hidden';
}

// ---- Login ----
function handleLogin() {
  const email = $('login-email').value.trim();
  const password = $('login-password').value;

  if (!email || !password) {
    return showAlert('Please fill in all fields.', 'error');
  }

  showAlert('Welcome back, Officer! Redirecting...', 'success');

  setTimeout(() => {
    hideAlert();
    console.log('Redirect to dashboard');
  }, 1200);
}

// ---- Guest ----
function handleGuest() {
  showAlert('Entering as guest. Limited access.', 'success');

  $('login-email').value = '';
  $('login-password').value = '';

  setTimeout(() => {
    hideAlert();
    console.log('Redirect to guest page');
  }, 1000);
}

// ---- Signup ----
function handleSignup() {
  const name = $('signup-name').value.trim();
  const email = $('signup-email').value.trim();
  const password = $('signup-password').value;
  const confirm = $('signup-confirm').value;

  if (!name || !email || !password) {
    return showAlert('Please fill in all required fields.', 'error');
  }

  if (password !== confirm) {
    return showAlert('Passwords do not match.', 'error');
  }

  if (password.length < 8) {
    return showAlert('Password must be at least 8 characters.', 'error');
  }

  showAlert('Account created! Awaiting approval.', 'success');
}
  </script>

</body>
</html>
