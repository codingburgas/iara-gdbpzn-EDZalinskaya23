{% extends "base.html" %}
{% block title %}Вход за персонал{% endblock %}

{% block content %}
<div class="card narrow">
    <h1>Вход за персонал</h1>
    <form method="post" class="form">
        <label>Потребителско име
            <input type="text" name="username" value="{{ username or '' }}" required autofocus>
        </label>
        <label>Парола
            <input type="password" name="password" required>
        </label>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Вход</button>
        </div>
    </form>
    <p class="muted small">
        Демо достъп (парола: <code>1234</code>):<br>
        диспечер — <code>dispatcher</code> · пожарникар — <code>&lt;фамилия на латиница&gt;</code> · администратор — <code>admin</code>
    </p>
</div>
{% endblock %}
